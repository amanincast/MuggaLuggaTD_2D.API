<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MuggaLugga</title>
<style>
  :root { --paper: #e8d9b5; --ink: #2b2014; --muted: #6b5a40; --accent: #b4532a; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1f1a14; --ink: #efe3c8; --muted: #b7a684; --accent: #e07a4f; } }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
  body { font-family: Georgia, "Times New Roman", serif; display: grid; place-items: center; min-height: 100vh; padding: 0 16px; box-sizing: border-box; }
  main { max-width: 34rem; text-align: center; }
  .eyebrow { color: var(--accent); letter-spacing: .18em; font-size: .8rem; text-transform: uppercase; }
  h1 { font-size: clamp(2.6rem, 9vw, 4rem); margin: .2em 0; letter-spacing: .02em; }
  p { color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">A pop-up adventure</div>
  <h1>MuggaLugga</h1>
  <p>Testing is by invitation. If you have been invited, your download link and invite code are on their way.</p>
</main>
</body>
</html>
